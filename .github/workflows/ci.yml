name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: votosbr
          POSTGRES_PASSWORD: votosbr
          POSTGRES_DB: votosbr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U votosbr" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://votosbr:votosbr@localhost:5432/votosbr_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest --cov=votosbr --cov-report=term-missing
