services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: votosbr
      POSTGRES_USER: votosbr
      POSTGRES_PASSWORD: votosbr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votosbr -d votosbr"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Prepara o banco antes de API e worker subirem: migrações + seeds (ambos idempotentes).
  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && votosbr seed"]
    environment: &env
      DATABASE_URL: postgresql+psycopg://votosbr:votosbr@db:5432/votosbr
      DATABASE_URL_READONLY: postgresql+psycopg://votosbr_leitura:votosbr_leitura@db:5432/votosbr
      RAW_STORE_PATH: /data/raw
      LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Worker de ingestão: roda `run diario` ao subir e todo dia às 06h (Brasília).
  # Comandos avulsos: docker compose run --rm worker ingest camara-votacoes --dry-run
  worker:
    build: .
    entrypoint: ["votosbr"]
    command: ["run", "agendado"]
    environment: *env
    volumes:
      - rawdata:/data/raw
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  rawdata:
