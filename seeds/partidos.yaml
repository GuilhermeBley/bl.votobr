# Partidos e aliases por fonte (seção 6.6). Mantido manualmente.
#
# Siglas abaixo: as observadas em votos de Plenário da Câmara (tests/fixtures/camara/votos, out/2026),
# com a grafia exata da fonte. Ainda faltam:
#   - número eleitoral (TSE); nomes e id_externo vêm de GET /partidos da Câmara (2026-11-02);
#   - histórico: renomeações (alias com valido_de/valido_ate), fusões e incorporações (sucessor);
#   - aliases do Senado: só as siglas vistas em GET /votacao de 2026 ("S/Partido" = sem partido).
# Sigla sem alias válido na data -> partido_id nulo + alerta C04.
#
# Formato:
#   - slug: identificador público imutável
#     sigla_atual: ...
#     sucessor: <slug>            # opcional, fusão/incorporação
#     data_extincao: AAAA-MM-DD   # opcional
#     aliases:
#       - {fonte: CAMARA, sigla: ..., valido_de: null, valido_ate: null}

- {slug: avante, sigla_atual: AVANTE, nome: "Avante", aliases: [{fonte: CAMARA, sigla: AVANTE, id_externo: "36898"}, {fonte: SENADO, sigla: AVANTE}]}
